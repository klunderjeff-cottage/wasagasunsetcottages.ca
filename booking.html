<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Request</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header class="site-header">
    <div class="nav-container">
        <a href="index.html" class="logo">Wasaga Sunset Cottages</a>

        
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cottages.html">Cottages</a></li>
                <li><a href="rates.html">Rates & Availability</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="booking.html">Booking</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>

        <button class="hamburger" id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>
</header>

<div id="dynamic-banner"></div>


<main class="content">
    <section class="page-section">
        <h1>Booking Request</h1>

        <form action="https://formsubmit.co/klunderjeff@gmail.com" method="POST" class="contact-form">
            <input type="hidden" name="_captcha" value="false">

            <label>Cottage</label>
            <select name="cottage" id="cottage-select" required></select>

            <label>Check-in date</label>
            <input type="date" name="checkin" required>

            <label>Check-out date</label>
            <input type="date" name="checkout" required>

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Message</label>
            <textarea name="message" rows="5"></textarea>

            <button type="submit">Send Booking Request</button>
        </form>
    </section>
</main>

<footer class="site-footer">
    <p>© 2026 Wasaga Sunset Cottages — All Rights Reserved</p>
</footer>

<script src="js/cottages.js"></script>
<script>
    const select = document.getElementById('cottage-select');
    cottages.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name;
        select.appendChild(opt);
    });
</script>

<script src="js/banner.js"></script>
<script src="js/menu.js"></script>



</body>
</html>
